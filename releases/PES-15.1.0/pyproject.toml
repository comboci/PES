[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-evolution-pes15"
version = "15.1.0"
description = "Project Evolution Standard 15 reference implementation: validation, migration, context retrieval, transactional canonical store"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.22,<5"]

[project.scripts]
pes15 = "pes15.cli:main"

[tool.setuptools]
packages = ["pes15"]

[tool.setuptools.package-data]
pes15 = ["resources/*.json"]
